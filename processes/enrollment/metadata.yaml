# Per-process settings. Data only -- the engine reads this, it is never imported.
process_name: enrollment
display_name: Intake & Enrollment

# The swimlanes of the diagram, and what each one is. Every box sits in exactly one of
# these -- a step in the lane that performs it, a terminal in the lane that owns the
# outcome, an annotation in the lane of the box it describes. A bare name is not enough
# for the extractor to place a box: knowing JCRM runs the automations is what lets an
# automated step land in that lane.
# Listed in roughly the order they appear; that order is preserved into the prompt.
actors:
  HCP: the provider who actually gives the patient the prescription
  Patient: the patient
  CM360: an external hub that performs some enrollment activities
  PSM: a patient service manager, assigned to patients to help them through the patient journey
  PSM Manager: the PSM's own manager, whose approval is needed before an enrolment is cancelled
  HAS: a hemolytic anemia specialist, a field clinical role the PSM escalates outreach to
  QRAL: an integration layer used by the hub to transmit information to the Salesforce platform
  PSCRM: the Salesforce platform, which runs automations
  SP Biologics: a specialty pharmacy that performs some external hub activities

# The lane a box falls to when the source does not say who performs it. Source text
# routinely describes automated steps in the passive voice ("the PSM is assigned via
# zip to territory mapping"), which would otherwise leave the box without a lane.
# Must be one of the actors above.
default_actor: PSCRM

# Domain shorthand the source text uses without expanding. Given to the extractor
# so it does not mistake an acronym for an actor or invent a meaning for it.
# Anything that performs work belongs in actors above, not here.
glossary:
  PEF: Patient Enrollment Form
  CRM: Customer Relationship Management system
  BI: Benefits Investigation
  MI: Missing Information
  PHI: Protected Health Information
  JCRM: another name the source uses for PSCRM, the Salesforce platform; not a separate system

# Optional override of the model used for this process. Null uses the global default.
model_id: null
