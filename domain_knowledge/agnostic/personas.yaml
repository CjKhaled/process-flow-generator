# Personas: lane archetypes. Responsibilities, not job titles.
#
# Read by code. No client is chosen, so a session learns its own lane names from what the
# user says, and maps each one onto a persona here. The persona's lane_description is what
# the extractor uses to place work in that lane, combined with whatever the user said about it.
#
# Fields
#   name                  generic display name
#   lane_description      what this lane does: the basis for lane assignment
#   responsibilities      what this persona typically does in intake and enrollment
#   common_titles         titles and abbreviations seen across programs (recognition only)
#   overlaps_with         personas often combined in a single real role
#   assignment_hints      phrasing that usually means a step belongs in this lane
#   applies_when          optional program-fact condition (see README)
#
# Role titles and abbreviations (PSM, PAM, FRM...) live here, never in glossary.yaml, so a
# role is never mistaken for a term or a term for a role. System and document names (CRM, OCR,
# PEF...) live in glossary.yaml; a system still becomes a lane when the user attributes work to it.

schema_version: 2

personas:

  hcp_office:
    name: "HCP office"
    lane_description: "The prescriber and their office staff. Writes and signs the prescription and enrollment form, supplies clinical information, and responds to requests for missing items."
    responsibilities:
      - "Completes and submits the enrollment form"
      - "Signs the prescription, attestations and medical necessity statements"
      - "Supplies diagnosis, clinical documentation and insurance details"
      - "Responds to missing information and diagnosis clarification requests"
    common_titles: ["prescriber", "physician", "nurse practitioner", "physician assistant", "medical assistant", "office manager", "HCP", "prescribing office"]
    overlaps_with: []
    assignment_hints: ["the office sends", "the prescriber signs", "the HCP faxes", "the doctor"]

  patient_caregiver:
    name: "Patient or caregiver"
    lane_description: "The patient, or a caregiver or legal representative acting for them. Provides consent, contact details and insurance information, and may self-enroll."
    responsibilities:
      - "Signs consents"
      - "Self-enrolls where the program allows it"
      - "Responds to outreach"
    common_titles: ["patient", "caregiver", "parent", "guardian", "legal representative"]
    overlaps_with: []
    assignment_hints: ["the patient signs", "the patient enrolls online", "the caregiver"]

  specialty_pharmacy:
    name: "Specialty pharmacy"
    lane_description: "The dispensing pharmacy. May start enrollments, send prescriptions or referrals that complete or upgrade an enrollment, receive patients the program routes to it, or perform hub activities itself."
    responsibilities:
      - "Refers or enrolls patients"
      - "Sends prescriptions that complete or upgrade an enrollment"
      - "Receives patients routed from off-label review"
    common_titles: ["SP", "specialty pharmacy", "dispensing pharmacy"]
    overlaps_with: ["hub_case_owner", "external_vendor"]
    assignment_hints: ["the pharmacy sends", "SP referral", "routed to the pharmacy", "work directly with the pharmacy"]

  intake_keying:
    name: "Intake and data entry"
    lane_description: "Whoever turns a submission into system data: keys forms, searches before creating records, and often sends the first missing-information request. Often outsourced. Usually does not own the patient relationship."
    responsibilities:
      - "Claims new submissions from the work pool"
      - "Keys the form or resolves low-confidence automated fields"
      - "Searches for existing patients and prescribers"
      - "Creates the lead or patient record"
    common_titles: ["intake coordinator", "data entry", "intake team", "IC", "DE"]
    overlaps_with: ["hub_case_owner", "external_vendor"]
    assignment_hints: ["keys the form", "enters the data", "transcribes", "data entry", "intake team"]

  hub_case_owner:
    name: "Case owner"
    lane_description: "The person who owns the patient relationship and the case: chases missing information and consent, converts or enrolls the patient, and coordinates with the field and the pharmacy. Assigned by territory in most programs."
    responsibilities:
      - "Owns missing information and consent outreach"
      - "Converts the lead or completes enrollment"
      - "Makes or coordinates the welcome call"
      - "Escalates stalled HCP offices to the field"
    common_titles: ["case manager", "patient access manager", "patient services manager", "access specialist", "PAM", "PSM", "OSS"]
    overlaps_with: ["intake_keying", "clinical_educator"]
    assignment_hints: ["the case manager", "owns the case", "the PAM", "the PSM"]

  clinical_educator:
    name: "Nurse or clinical educator"
    lane_description: "Nurse or clinical educator support: welcome or onboarding contact, injection training and education. May run a welcome call in parallel with the case owner."
    responsibilities:
      - "Clinical welcome contact"
      - "Training and education enrollment"
    common_titles: ["nurse", "nurse case manager", "clinical educator", "nurse educator", "NCM"]
    overlaps_with: ["hub_case_owner"]
    assignment_hints: ["the nurse", "the educator calls", "nurse welcome"]

  field_reimbursement:
    name: "Field reimbursement or clinical field staff"
    lane_description: "Field-based access, reimbursement or clinical specialists who engage HCP offices in person or by phone when they stall. Receive escalations from the case owner, and may be restricted from seeing patient health information."
    responsibilities:
      - "Engages unresponsive HCP offices"
      - "Reports outcomes back to the case"
    common_titles: ["field reimbursement manager", "regional access manager", "clinical specialist", "FRM", "RAM", "ARM"]
    overlaps_with: ["field_sales"]
    assignment_hints: ["escalate to the field", "the field team", "the rep visits", "the specialist reaches out to the office"]

  field_sales:
    name: "Field sales or liaison"
    lane_description: "Commercial field staff or liaisons who may be told about stalled cases or prompt offices, without handling patient-specific details unless permitted."
    responsibilities:
      - "Prompts offices to complete submissions"
      - "Joins standing review meetings where cases are discussed"
    common_titles: ["sales representative", "field liaison", "key account manager", "KAM"]
    overlaps_with: ["field_reimbursement"]
    assignment_hints: ["the rep", "sales", "the field liaison"]

  manager:
    name: "Manager or supervisor"
    lane_description: "Supervisors who approve exceptions such as cancellations, verify legal documents, or receive escalations the case owner can't resolve."
    responsibilities:
      - "Approves exceptions and cancellations"
      - "Verifies representative authority documents"
      - "Receives escalations"
    common_titles: ["manager", "supervisor", "team lead"]
    overlaps_with: []
    assignment_hints: ["the manager approves", "escalate to the supervisor", "once the manager signs off"]

  crm_automation:
    name: "CRM and automation"
    lane_description: "The system of record and its automations: creates records and tasks, routes ownership by ZIP code, sets statuses, and sends automated faxes, emails and e-sign requests. The default lane for steps described in the passive voice with no person named."
    responsibilities:
      - "Creates leads, records and tasks"
      - "Routes ownership by territory"
      - "Sets statuses and due dates"
      - "Sends automated faxes, emails and e-sign requests"
    common_titles: ["Salesforce", "the system", "the platform", "automation", "workflow"]
    overlaps_with: ["document_ai"]
    assignment_hints: ["is created", "is assigned", "automatically", "the system", "a task is generated"]

  integration_layer:
    name: "Integration layer"
    lane_description: "Middleware that moves data between a vendor's or hub's systems and the CRM. Some teams draw it as its own lane because hand-offs through it matter to them."
    responsibilities:
      - "Transmits records, statuses and milestones between systems"
    common_titles: ["integration", "middleware", "interface", "data feed"]
    overlaps_with: ["crm_automation"]
    assignment_hints: ["is sent to", "passes it to", "transmits", "the feed"]

  document_ai:
    name: "Document AI"
    lane_description: "Automated document reading: classifies incoming documents and maps fields onto records, leaving low-confidence results for a person to resolve."
    responsibilities:
      - "Classifies documents"
      - "Extracts and maps fields"
      - "Flags low-confidence fields for review"
    common_titles: ["document AI", "document reader", "extraction"]
    overlaps_with: ["crm_automation"]
    assignment_hints: ["OCR reads", "IDP classifies", "extracted automatically"]

  external_vendor:
    name: "External hub vendor"
    lane_description: "A vendor that does intake or hub work in its own systems and feeds results into the CRM. Its internal steps are often only partly visible to the person describing the process."
    responsibilities:
      - "Keys forms and creates records upstream"
      - "Decides duplicates or restarts"
      - "Sends the first missing-information requests"
      - "Starts downstream work when complete"
    common_titles: ["hub vendor", "vendor", "outsourced team"]
    overlaps_with: ["intake_keying", "hub_case_owner"]
    assignment_hints: ["the vendor handles", "sent to the vendor", "comes back from the vendor", "on the vendor's end"]

  rems_administrator:
    name: "REMS administrator"
    lane_description: "The organisation that runs a REMS program: certifies prescribers and pharmacies, enrolls patients, and confirms requirements are met before dispensing."
    responsibilities:
      - "Certifies and enrolls"
      - "Confirms REMS requirements"
    common_titles: ["REMS administrator", "REMS call center"]
    overlaps_with: []
    assignment_hints: ["REMS confirms", "the REMS program"]
    applies_when: {product.has_rems: true}
