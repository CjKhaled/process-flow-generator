# Render blueprint for the service.
#
# The free plan sleeps an instance after fifteen idle minutes and takes the
# better part of a minute to wake. The page asks for the process list on load,
# which starts that early; if a demo cannot afford even that, this is the line
# to change. Sessions are written to the instance's disk, which a free instance
# does not keep across a restart: a redeploy loses conversations in progress.
services:
  - type: web
    name: pfg-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Set in the Render dashboard, never here.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The origin the page is served from, e.g. https://cjkhaled.github.io.
      # Left unset, any origin may call the service.
      - key: PFG_ALLOWED_ORIGIN
        sync: false
