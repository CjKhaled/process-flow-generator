<!doctype html>
<!--
  The stage 3 page shell. Generated pages are written by render/page.py, which
  fills the PFG comment sentinels below by plain string replacement. It is not
  str.format or string.Template: this file is full of CSS braces, and either
  would need every one of them doubled. A sentinel may appear more than once,
  as the title does, since replacement fills every occurrence.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--PFG:TITLE--></title>
<style>
<!--PFG:STYLES-->
</style>
<style>
  :root {
    --ink: #1a1d21;
    --muted: #6b7280;
    --line: #e3e6ea;
    --panel: #ffffff;
    --page: #f4f5f7;
    --flag: #b45309;
    --flag-soft: #fef3c7;
    --flag-tint: #fffbeb;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }

  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }

  header .spacer { flex: 1; }

  .controls { display: flex; gap: 6px; }

  .controls button {
    min-width: 32px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  .controls button:hover { background: var(--page); }

  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  #canvas {
    flex: 1;
    min-width: 0;
    background: var(--panel);
  }

  aside {
    width: 340px;
    flex: none;
    overflow-y: auto;
    padding: 16px;
    border-left: 1px solid var(--line);
    background: var(--panel);
  }

  aside h2 {
    margin: 0 0 4px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  aside .lede {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 12px;
  }

  .questions {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .question {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--flag);
    border-radius: 6px;
    background: var(--flag-tint);
  }

  .question[data-elements] { cursor: pointer; }

  .question:hover { border-color: var(--flag); }

  .question.active {
    background: var(--flag-soft);
    box-shadow: 0 0 0 2px var(--flag-soft);
  }

  .question .code {
    display: inline-block;
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--flag);
  }

  .question .message {
    display: block;
    color: var(--ink);
  }

  .empty {
    margin: 0;
    padding: 12px;
    border: 1px dashed var(--line);
    border-radius: 6px;
    color: var(--muted);
  }

  /* Boxes a human still has to settle. The first child of a shape's visual is
     its outline -- rect, circle or polygon -- so this reaches every element type
     without knowing which one it is. */
  .pfg-flagged .djs-visual > :nth-child(1) {
    stroke: var(--flag) !important;
    stroke-width: 2px !important;
    stroke-dasharray: 6 4 !important;
    fill: var(--flag-tint) !important;
  }

  .pfg-active .djs-visual > :nth-child(1) {
    stroke-width: 3px !important;
    stroke-dasharray: none !important;
    fill: var(--flag-soft) !important;
  }

  #failure {
    margin: 24px;
    padding: 16px;
    border: 1px solid var(--flag);
    border-radius: 6px;
    background: var(--flag-tint);
    color: var(--flag);
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<header>
  <h1><!--PFG:TITLE--></h1>
  <div class="spacer"></div>
  <div class="controls">
    <button type="button" data-zoom="out" title="Zoom out">&minus;</button>
    <button type="button" data-zoom="fit">Fit</button>
    <button type="button" data-zoom="in" title="Zoom in">+</button>
  </div>
</header>
<main>
  <div id="canvas"></div>
  <aside>
    <!--PFG:QUESTIONS-->
  </aside>
</main>
<pre id="failure" hidden></pre>
<script type="application/json" id="pfg-data"><!--PFG:DATA--></script>
<script>
<!--PFG:VIEWER_JS-->
</script>
<script>
(function () {
  'use strict';

  var FLAGGED = 'pfg-flagged';
  var ACTIVE = 'pfg-active';

  var data = JSON.parse(document.getElementById('pfg-data').textContent);
  var questions = Array.prototype.slice.call(document.querySelectorAll('.question[data-elements]'));
  var viewer = new BpmnJS({ container: '#canvas' });

  viewer.importXML(data.diagram).then(function (result) {
    if (result.warnings && result.warnings.length) {
      console.warn('bpmn-js import warnings', result.warnings);
    }
    start();
  }).catch(fail);

  function start() {
    var canvas = viewer.get('canvas');
    var registry = viewer.get('elementRegistry');

    fit();
    data.flagged.forEach(function (id) {
      if (registry.get(id)) {
        canvas.addMarker(id, FLAGGED);
      }
    });

    // Which question concerns which element, so a click on the diagram can find
    // its way back to the panel.
    var byElement = {};
    questions.forEach(function (question) {
      elementsOf(question).forEach(function (id) {
        byElement[id] = byElement[id] || question;
      });
      question.addEventListener('click', function () {
        select(question, true);
      });
    });

    viewer.get('eventBus').on('element.click', function (event) {
      var question = byElement[event.element.id];
      if (question) {
        select(question, false);
      }
    });

    document.querySelector('.controls').addEventListener('click', function (event) {
      var how = event.target.getAttribute('data-zoom');
      if (how === 'fit') {
        fit();
      } else if (how === 'in') {
        canvas.zoom(canvas.zoom() * 1.2);
      } else if (how === 'out') {
        canvas.zoom(canvas.zoom() / 1.2);
      }
    });

    // A process is far wider than it is tall, so fitting it to the viewport
    // leaves slack on one axis: 'auto' centres in that slack instead of hanging
    // the diagram off the top-left corner. Never magnified past life size -- a
    // four-box diagram blown up to fill a monitor looks like a mistake.
    function fit() {
      canvas.zoom('fit-viewport', 'auto');
      if (canvas.zoom() > 1) {
        canvas.zoom(1, 'auto');
      }
    }

    function select(question, scroll) {
      questions.forEach(function (other) {
        other.classList.remove('active');
        elementsOf(other).forEach(function (id) {
          if (registry.get(id)) {
            canvas.removeMarker(id, ACTIVE);
          }
        });
      });

      question.classList.add('active');
      var found = elementsOf(question).filter(function (id) { return registry.get(id); });
      found.forEach(function (id) { canvas.addMarker(id, ACTIVE); });

      if (scroll && found.length) {
        canvas.scrollToElement(registry.get(found[0]));
      } else {
        question.scrollIntoView({ block: 'nearest' });
      }
    }
  }

  function elementsOf(question) {
    var value = question.getAttribute('data-elements');
    return value ? value.split(' ') : [];
  }

  function fail(error) {
    var failure = document.getElementById('failure');
    failure.hidden = false;
    failure.textContent = 'The diagram could not be rendered.\n\n' + (error && error.message ? error.message : error);
    console.error(error);
  }
})();
</script>
</body>
</html>
