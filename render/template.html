<!doctype html>
<!--
  The page shell for stage 3's diagram.html. render/page.py fills the PFG comment
  sentinels below by plain string replacement -- not str.format or
  string.Template, since this file is full of CSS braces and either would need
  every one of them doubled. A sentinel may appear more than once, as the title
  does, since replacement fills every occurrence.

  The page arrives with its diagram already inlined and fetches nothing: it is
  one self-contained file, opened from wherever the reader keeps it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--PFG:TITLE--></title>
<style>
<!--PFG:STYLES-->
</style>
<style>
  /* The palette and the two typefaces are the conversation page's, so a finished
     diagram shown inside it reads as the same product. Orange text on white is
     the deep orange, never Mango itself, which is only 3:1 there. */
  :root {
    --ink: #1A1628;
    --ink-2: #3A3650;
    --muted: #5C5970;
    --line: #E3E1EA;
    --line-strong: #CFCCD9;
    --panel: #FFFFFF;
    --page: #F5F4F7;
    --mango: #EC7700;
    --flag: #A85400;
    --flag-soft: #FFF1E3;
    --flag-tint: #FFF8F0;
    --flag-line: #F5C08A;
    --accent: #1A1628;
    --danger: #b91c1c;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  /* The attribute has to win: any rule setting `display` outranks the browser's
     own [hidden] rule. */
  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--page);
    color: var(--ink);
    font: 15px/24px var(--sans);
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }

  header h1 {
    margin: 0;
    font-size: 16px;
    line-height: 22px;
    font-weight: 600;
  }

  header .spacer { flex: 1; }

  .controls { display: flex; gap: 6px; }

  button {
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }

  button:hover { background: var(--page); border-color: var(--ink-2); }
  button[disabled] { opacity: 0.5; cursor: default; }

  .controls button { min-width: 32px; }

  .controls .toggle[aria-expanded="true"] {
    border-color: var(--flag-line);
    background: var(--flag-soft);
    color: var(--flag);
  }

  /* ---- edit mode ------------------------------------------------------

     The modeler is live from the moment it is constructed, so "not editing" is
     a state this page builds rather than one bpmn-js offers. The script refuses
     every mutating command while it is off; these rules take away the things
     that would otherwise invite one. Hiding rather than removing, because both
     are bpmn-js's own DOM and it puts them back whenever it likes. */
  .controls .edit[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--panel);
  }

  body:not([data-editing="on"]) .reset,
  body:not([data-editing="on"]) #scratch,
  body:not([data-editing="on"]) .djs-palette,
  body:not([data-editing="on"]) .djs-context-pad { display: none; }

  /* Floats over the canvas like the questions drawer, for the same reason: it
     must not resize the diagram, because that would move every box the moment
     editing began. */
  #scratch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    margin: 0;
    max-width: min(560px, calc(100% - 32px));
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    box-shadow: 0 2px 8px rgb(0 0 0 / 8%);
    font-size: 13px;
    line-height: 1.45;
    color: var(--muted);
  }

  /* ---- the diagram view ---------------------------------------------- */

  main {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  /* The canvas is the whole of main, always. The panel floats above it, so
     opening or closing the panel cannot change the canvas's size and the
     diagram never has to be re-fitted. */
  #canvas {
    position: absolute;
    inset: 0;
    background: var(--panel);
  }

  aside {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 340px;
    overflow-y: auto;
    padding: 16px;
    border-left: 1px solid var(--line);
    background: var(--panel);
    box-shadow: -10px 0 30px rgba(15, 23, 42, 0.08);
    transform: translateX(calc(100% + 30px));
    transition: transform 0.18s ease;
  }

  body[data-panel="open"] aside { transform: none; }

  aside .close {
    float: right;
    min-width: 26px;
    height: 26px;
    padding: 0;
    line-height: 1;
    color: var(--muted);
  }

  aside h2 {
    margin: 0 0 4px;
    font: 500 12px/16px var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-2);
  }

  aside .lede {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 13px;
    line-height: 20px;
  }

  .questions {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .question {
    padding: 10px 12px;
    border: 1px solid var(--flag-line);
    border-left: 3px solid var(--mango);
    border-radius: 6px;
    background: var(--flag-soft);
    font-size: 13px;
    line-height: 20px;
  }

  .question[data-elements] { cursor: pointer; }

  .question:hover { border-color: var(--mango); }

  /* Selection never rests on colour alone: a dark ring, set off from the card by a white gap. */
  .question.active {
    box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--ink);
  }

  .question .code {
    display: inline-block;
    margin-bottom: 4px;
    font: 500 11px/16px var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8A4300;
  }

  .question .message {
    display: block;
    color: var(--ink);
  }

  .empty {
    margin: 0;
    padding: 12px;
    border: 1px dashed var(--line);
    border-radius: 6px;
    color: var(--muted);
  }

  /* A collapsed subprocess is the end of the path at this level, so the marker
     that promises something inside is a promise the diagram does not keep. It is
     drawn as a small square and a plus: the second rect of the visual, and the
     only path carrying a data-marker. The semantic file keeps the subProcess --
     any BPMN tool opening it should still see one -- this is the drawing only. */
  #canvas [data-element-id^="Node_sub_"] .djs-visual > rect:nth-of-type(n + 2),
  #canvas [data-element-id^="Node_sub_"] .djs-visual > path[data-marker] {
    display: none !important;
  }

  /* A note is a box, not an open bracket. bpmn-js draws a textAnnotation as an
     invisible rect plus a bracket path; the rect is given the border and the
     bracket is dropped, so the note reads as the box of context it is. An id
     prefix is the handle here because the SVG element cannot distinguish these:
     a textAnnotation is a rect like a task is, which is why annotations carry a
     prefix of their own. */
  #canvas [data-element-id^="Note_"] .djs-visual > rect {
    stroke: var(--line) !important;
    stroke-width: 2px !important;
    fill: var(--page) !important;
  }

  #canvas [data-element-id^="Note_"] .djs-visual > path {
    display: none !important;
  }

  /* And the connector to it is a line, not a dotted hint. */
  #canvas [data-element-id^="Association_"] .djs-visual > path {
    stroke-dasharray: none !important;
    stroke: var(--muted) !important;
  }

  /* ---- labels on top of lines ------------------------------------------

     A Yes or No sitting on its arrow is unreadable where the two cross. Painting
     the stroke first and the fill over it gives each glyph a background-coloured
     halo, which is how every other diagramming tool solves this. `_label` is the
     suffix diagram-js gives an external label element, so this reaches labels
     that float free -- on flows and gateways -- and never text set inside a box,
     which needs no halo and would look bruised by one. */
  [data-element-id$="_label"] .djs-label {
    paint-order: stroke;
    stroke: var(--panel);
    stroke-width: 3px;
    stroke-linejoin: round;
  }

  /* Boxes a human still has to settle. The first child of a shape's visual is
     its outline -- rect, circle or polygon -- so this reaches every element type
     without knowing which one it is. */
  .pfg-flagged .djs-visual > :nth-child(1) {
    stroke: var(--mango) !important;
    stroke-width: 2px !important;
    fill: var(--flag-tint) !important;
  }

  .pfg-active .djs-visual > :nth-child(1) {
    stroke: var(--ink) !important;
    stroke-width: 3px !important;
    fill: var(--flag-soft) !important;
  }

  #failure {
    margin: 24px;
    padding: 16px;
    border: 1px solid var(--flag);
    border-radius: 6px;
    background: var(--flag-tint);
    color: var(--flag);
    white-space: pre-wrap;
  }
</style>
</head>
<body data-panel="open" data-editing="off">
<header>
  <h1><!--PFG:TITLE--></h1>
  <div class="spacer"></div>
  <div class="controls">
    <button type="button" class="reset" data-action="reset">Reset</button>
    <button type="button" class="edit" data-action="edit" aria-pressed="false">Edit</button>
    <button type="button" class="toggle" data-action="panel" aria-expanded="true" aria-controls="panel">Open questions</button>
    <button type="button" data-zoom="out" title="Zoom out">&minus;</button>
    <button type="button" data-zoom="fit">Fit</button>
    <button type="button" data-zoom="in" title="Zoom in">+</button>
  </div>
</header>
<main>
  <p id="scratch">Changes are a scratchpad. Nothing is saved, and reloading restores the generated diagram.
    The open questions still describe the original.</p>
  <div id="canvas"></div>
  <aside id="panel">
    <button type="button" class="close" data-action="panel" title="Hide">&times;</button>
    <div id="questions"><!--PFG:QUESTIONS--></div>
  </aside>
</main>
<pre id="failure" hidden></pre>
<script type="application/json" id="pfg-data"><!--PFG:DATA--></script>
<script>
<!--PFG:VIEWER_JS-->
</script>
<script>
(function () {
  'use strict';

  var FLAGGED = 'pfg-flagged';
  var ACTIVE = 'pfg-active';

  var data = JSON.parse(document.getElementById('pfg-data').textContent);
  var body = document.body;
  var panelBody = document.getElementById('questions');
  var toggle = document.querySelector('.toggle');

  // Everything about how a diagram is drawn -- the modules, the read-only
  // state, the shapes -- lives in js/src/ and arrives as one bundle. This
  // script's job is the page around it.
  var viewer = PFG.createViewer('#canvas');
  var canvas = viewer.get('canvas');
  var registry = viewer.get('elementRegistry');
  var edit = document.querySelector('.edit');
  var cards = [];
  var byElement = {};
  var wired = false;
  var shown = null;

  document.querySelector('header').addEventListener('click', function (event) {
    var action = event.target.getAttribute('data-action');
    var how = event.target.getAttribute('data-zoom');
    if (action === 'panel') {
      setPanel(body.getAttribute('data-panel') !== 'open');
    } else if (action === 'edit') {
      setEditing(body.getAttribute('data-editing') !== 'on');
    } else if (action === 'reset') {
      // Re-imports the diagram as it was generated. `shown` is never written to,
      // so it is still the original however much the canvas has been rearranged.
      if (shown) {
        show(shown);
      }
    } else if (how === 'fit') {
      fit();
    } else if (how === 'in') {
      canvas.zoom(canvas.zoom() * 1.2);
    } else if (how === 'out') {
      canvas.zoom(canvas.zoom() / 1.2);
    }
  });

  document.querySelector('aside').addEventListener('click', function (event) {
    if (event.target.getAttribute('data-action') === 'panel') {
      setPanel(false);
    }
  });

  // The page arrives with its diagram already in it, and shows it at once.
  show(data);

  // ---- the diagram ------------------------------------------------------

  function show(payload) {
    shown = payload;
    label(payload.count);

    return viewer.importXML(payload.diagram).then(function (result) {
      if (result.warnings && result.warnings.length) {
        console.warn('bpmn-js import warnings', result.warnings);
      }
      mark(payload.flagged || []);
      wire();
      fit();
    }).catch(fail);
  }

  function mark(flagged) {
    cards = Array.prototype.slice.call(document.querySelectorAll('.question[data-elements]'));
    byElement = {};
    flagged.forEach(function (id) {
      if (registry.get(id)) {
        canvas.addMarker(id, FLAGGED);
      }
    });
    cards.forEach(function (card) {
      elementsOf(card).forEach(function (id) {
        byElement[id] = byElement[id] || card;
      });
    });
  }

  // Once only: Reset re-imports the diagram, but the panel's clicks and the
  // event bus outlive it, and registering them twice would fire twice.
  function wire() {
    if (wired) {
      return;
    }
    wired = true;

    panelBody.addEventListener('click', function (event) {
      var card = event.target.closest ? event.target.closest('.question[data-elements]') : null;
      if (card) {
        select(card, true);
      }
    });

    viewer.get('eventBus').on('element.click', function (event) {
      var card = byElement[event.element.id];
      if (card) {
        setPanel(true);
        select(card, false);
      }
    });
  }

  // A process is far wider than it is tall, so fitting it to the viewport
  // leaves slack on one axis: 'auto' centres in that slack instead of hanging
  // the diagram off the top-left corner. Never magnified past life size -- a
  // four-box diagram blown up to fill a monitor looks like a mistake.
  //
  // The panel floats over the canvas rather than taking space from it, which is
  // what keeps toggling it free of any layout effect -- but it does mean the
  // right of a fitted diagram would sit underneath it. So a fit made while the
  // panel is open fits to the part still on show. Toggling deliberately does
  // *not* re-fit: the diagram staying exactly where it was is the point, and
  // Fit is there for whoever wants the other framing.
  function fit() {
    canvas.zoom('fit-viewport', 'auto');

    var covered = body.getAttribute('data-panel') === 'open' ? document.querySelector('aside').offsetWidth : 0;
    var width = canvas.getSize().width;
    if (covered && width > covered * 1.5) {
      canvas.zoom(canvas.zoom() * (width - covered) / width, 'auto');
    }
    if (canvas.zoom() > 1) {
      canvas.zoom(1, 'auto');
    }
    if (covered && width > covered * 1.5) {
      // Centred in the whole canvas a moment ago; this puts it in the middle of
      // what the reader can actually see.
      canvas.scroll({ dx: -covered / 2, dy: 0 });
    }
  }

  function select(card, scroll) {
    cards.forEach(function (other) {
      other.classList.remove('active');
      elementsOf(other).forEach(function (id) {
        if (registry.get(id)) {
          canvas.removeMarker(id, ACTIVE);
        }
      });
    });

    card.classList.add('active');
    var found = elementsOf(card).filter(function (id) { return registry.get(id); });
    found.forEach(function (id) { canvas.addMarker(id, ACTIVE); });

    if (scroll && found.length) {
      canvas.scrollToElement(registry.get(found[0]));
    } else {
      card.scrollIntoView({ block: 'nearest' });
    }
  }

  function elementsOf(card) {
    var value = card.getAttribute('data-elements');
    return value ? value.split(' ') : [];
  }

  function setPanel(open) {
    body.setAttribute('data-panel', open ? 'open' : 'closed');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  // The flag the rules read, plus the attribute on `body`. That attribute is the
  // page's record of the state and has three readers -- the stylesheet, which
  // hides the palette and the context pad; the button, which reads it back to
  // know what to flip to; and a person with the inspector open. The flag itself
  // lives in `js/src/editGate.js` and is not visible from here, which is why the
  // button asks the attribute rather than keeping a second copy that could drift.
  // Nothing is re-imported on the way in or out: turning editing off leaves
  // whatever was rearranged on screen, and Reset is what puts it back.
  function setEditing(on) {
    PFG.setEditing(on);
    body.setAttribute('data-editing', on ? 'on' : 'off');
    edit.setAttribute('aria-pressed', on ? 'true' : 'false');
    edit.textContent = on ? 'Done' : 'Edit';
  }

  function label(count) {
    toggle.textContent = typeof count === 'number' ? 'Open questions (' + count + ')' : 'Open questions';
  }

  function fail(error) {
    var failure = document.getElementById('failure');
    failure.hidden = false;
    failure.textContent = 'The diagram could not be rendered.\n\n' + (error && error.message ? error.message : error);
    console.error(error);
  }
})();
</script>
</body>
</html>
