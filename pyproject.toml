[project]
name = "process-flow-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CjKhaled", email = "clauvinsalexander@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.3",
    "strands-agents[anthropic]>=1.51.0",
]

# Not a distributable library: the stages are top-level packages run from the repo
# root (`uv run python -m pipelines.stage1`), so there is nothing for uv to build.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# pyproject.toml
[tool.ruff]
line-length = 120
target-version = "py312"
# Vendored skill documentation, not project source.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# pyproject.toml
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
