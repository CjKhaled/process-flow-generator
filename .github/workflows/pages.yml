# Build the demo page and publish it to GitHub Pages.
#
# No API key is needed: this builds the page that *asks* for a run, not a run.
# The pipeline itself lives in the Render service the page calls, whose URL is
# the PFG_API_BASE repository variable (Settings -> Secrets and variables ->
# Actions -> Variables). It is a public URL, so it is a variable and not a secret.
#
# Pages must be set to deploy from GitHub Actions: Settings -> Pages -> Source.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install
        run: |
          uv sync --frozen
          npm ci --prefix js

      # The page inlines bpmn-js, which is why the npm install above is not
      # optional here.
      - name: Build the page
        run: uv run python -m pipelines.site --api-base "${{ vars.PFG_API_BASE }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
